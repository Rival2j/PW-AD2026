<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Nexo</title>
		<link href="css/style.css" rel="stylesheet">
	</head>
	<body>
	  <main class="contenedor">
	    <div class="cont-izq">
	      <div class="panel-login">
		<div class="tarjeta">
		  <img class="logo" src="img/logoNexo.png" alt="">
		  <div class="bienvenida">
		    <h2>Buenos dias</h2>
		    <p>Ingresa tus datos para continuar</p>
		  </div>
		  <div class="campo">
		    <label>Usuario</label>
		    <div class="input-contenedor">
		      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> <circle cx="12" cy="8" r="4" /> <path d="M5 21v-2a7 7 0 0 1 14 0v2" /> </svg>
		      <input type="text" placeholder="Ingresa tu usuario" value="">
		    </div>
		  </div>
		  <div class="campo">
		    <label>Contraseña</label>
		    <div class="input-contenedor">
		      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> <rect x="3" y="11" width="18" height="11" rx="2" /> <path d="M7 11V7a5 5 0 0 1 10 0v4" /> </svg>
		      <input type="password" placeholder="Ingresa tu contraseña" value="">
		    </div>
		  </div>
		    <button type="submit">Ingresar</button>
		    <p class="recuperar">
		    <a href="#">Olvidaste tu contraseña?</a>
		    <hr>
		    </p>
		    <footer>
		    	<p class="privacidad">Consulta nuestro aviso de privacidad
			<a href="#">Aqui</a>
			</p>
			<p class="soporte">Si detectas actividad sospechosa, reportalo
			a
			<a href="#">Centro de computo</a>
			</p>
		    </footer>
		</div>
	      </div>
	    </div>
	    <div class="cont-der">
	      <div class="contenido-institucional">
		<img src="img/logosTec.png" alt="">
		<h2>Bienvenido(a) al sistema NEXO</h2>
		<p>Tu plataforma integral de servicios academicos del
		Instituto Tecnologico de Tepic</p>
	      </div>
	    </div>
	  </main>
	</body>
</html>
