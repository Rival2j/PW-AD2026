<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Netflix</title>
		<link href="css/style.css" rel="stylesheet">
	</head>
	<body>
	  <div class="head">
	    <img src="img/netflix-logo.png" alt="netflix-logo"
	    width="100px">
	    <div class="head-right">
	      <select class="lenguaje-selector">
		<option value="">Español</option>
		<option value="">Aleman</option>
		<option value="">Japones</option>
		<option value="">Ingles</option>
	      </select>
	      <button class="button">Iniciar sesion</button>
	    </div>
	  </div>
	  <div class="registro">	
	    <div class="text-display">
	      <h1>Peliculas y Series <br>ilimitadas y mucho mas</h1>
	      <p><strong>A partir de $139. Cancela cuando quieras</strong></p>
	      <p>Quieres ver Netflix ya? Ingresa tu email para crear
	      una cuenta o recibir tu membresia</p>
	    </div>
	    <div class="registro">
	      <form>
		<input type="email" placeholder="Email" value="">
		<button class="button" type="submit">Comenzar &gt;</button>
	      </form>
	    </div>
	  </div>
	</body>
</html>
